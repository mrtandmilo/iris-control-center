name: Windows PowerShell smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-smoke.yml
      - scripts/smoke-test.ps1
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows PowerShell client
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral encryption key
        shell: pwsh
        run: |
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/private.pem", $rsa.ExportRSAPrivateKeyPem())
          [IO.File]::WriteAllText("public.pem", $rsa.ExportSubjectPublicKeyInfoPem())
      - uses: actions/upload-artifact@v4
        with:
          name: windows-public-key
          path: public.pem
          retention-days: 1
      - name: Wait for disposable IRIS endpoint and execute both Windows shells
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(18)
          $artifact = $null
          while ((Get-Date) -lt $deadline) {
            $items = gh api "repos/$env:GH_REPO/actions/runs/$env:RUN_ID/artifacts" | ConvertFrom-Json
            $artifact = $items.artifacts | Where-Object name -eq 'iris-encrypted-connection' | Select-Object -First 1
            if ($artifact) { break }
            Start-Sleep -Seconds 10
          }
          if (!$artifact) { throw 'Timed out waiting for the IRIS runtime.' }
          gh api "repos/$env:GH_REPO/actions/artifacts/$($artifact.id)/zip" > "$env:RUNNER_TEMP/connection.zip"
          if ($LASTEXITCODE) { throw 'Could not download connection.' }
          Expand-Archive "$env:RUNNER_TEMP/connection.zip" "$env:RUNNER_TEMP/connection"
          $rsa = [System.Security.Cryptography.RSA]::Create()
          $rsa.ImportFromPem([IO.File]::ReadAllText("$env:RUNNER_TEMP/private.pem"))
          $bytes = $rsa.Decrypt([IO.File]::ReadAllBytes("$env:RUNNER_TEMP/connection/connection.enc"), [System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
          $connection = [Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
          Write-Output "::add-mask::$($connection.password)"
          Write-Output "::add-mask::$($connection.url)"
          $env:IRIS_PASSWORD = $connection.password
          $env:IRIS_TEST_BASE_URL = $connection.url
          Start-Transcript -Path windows-smoke.log
          Write-Output "Tested commit: $(git rev-parse HEAD)"
          Write-Output "Windows: $([Environment]::OSVersion.VersionString)"
          Write-Output "PowerShell 7: $($PSVersionTable.PSVersion)"
          & ./scripts/smoke-test.ps1 -BaseUrl $connection.url
          Write-Output 'Now executing the same script in Windows PowerShell 5.1'
          & powershell.exe -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion; & .\scripts\smoke-test.ps1 -BaseUrl $env:IRIS_TEST_BASE_URL'
          if ($LASTEXITCODE) { throw 'Windows PowerShell 5.1 smoke test failed.' }
          Stop-Transcript
      - name: Sanitize transcript and remove temporary credentials
        if: always()
        shell: pwsh
        run: |
          if (Test-Path windows-smoke.log) {
            $text = [IO.File]::ReadAllText("$pwd/windows-smoke.log")
            $text = $text -replace 'https://[^\s/]+\.trycloudflare\.com', '[temporary test endpoint]'
            [IO.File]::WriteAllText("$pwd/windows-smoke.log", $text)
          }
          Remove-Item "$env:RUNNER_TEMP/private.pem", "$env:RUNNER_TEMP/connection" -Recurse -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-powershell-evidence
          path: windows-smoke.log
          retention-days: 14
  iris:
    name: Disposable Linux IRIS runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Start validated disposable IRIS
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$password"
          echo "IRIS_PASSWORD=$password" >> "$GITHUB_ENV"
          export IRIS_PASSWORD="$password"
          docker compose up --build -d
          ./scripts/smoke-test.sh
      - name: Create restricted temporary connection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            key_id=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "windows-public-key") | .id' | head -1)
            if [ -n "$key_id" ]; then break; fi
            sleep 10
          done
          test -n "$key_id"
          gh api "repos/$GH_REPO/actions/artifacts/$key_id/zip" > "$RUNNER_TEMP/key.zip"
          unzip -o "$RUNNER_TEMP/key.zip" -d "$RUNNER_TEMP/key"
          cat > "$RUNNER_TEMP/proxy.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import urllib.request, urllib.error
          class Proxy(BaseHTTPRequestHandler):
              def log_message(self, *args): pass
              def do_GET(self):
                  if self.path not in ['/iris-control-center/api/health', '/iris-control-center/api/services']:
                      self.send_error(404); return
                  req = urllib.request.Request('http://127.0.0.1:52773'+self.path, headers={'Authorization':self.headers.get('Authorization',''), 'Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as result:
                          body=result.read(); self.send_response(result.status); self.send_header('Content-Type','application/json'); self.end_headers(); self.wfile.write(body)
                  except urllib.error.HTTPError as e:
                      self.send_error(e.code)
          HTTPServer(('127.0.0.1',8765),Proxy).serve_forever()
          PY
          python3 "$RUNNER_TEMP/proxy.py" > "$RUNNER_TEMP/proxy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/proxy.pid"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$RUNNER_TEMP/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" tunnel --url http://127.0.0.1:8765 --no-autoupdate > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tunnel.pid"
          for attempt in $(seq 1 60); do
            url=$(sed -nE 's/.*(https:\/\/[a-zA-Z0-9-]+\.trycloudflare\.com).*/\1/p' "$RUNNER_TEMP/tunnel.log" | head -1)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done
          test -n "$url"
          echo "::add-mask::$url"
          export TEST_URL="$url"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP']+'/connection.json').write_text(json.dumps({'url':os.environ['TEST_URL'],'password':os.environ['IRIS_PASSWORD']}))
          PY
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/key/public.pem" -in "$RUNNER_TEMP/connection.json" -out connection.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm "$RUNNER_TEMP/connection.json"
      - uses: actions/upload-artifact@v4
        with:
          name: iris-encrypted-connection
          path: connection.enc
          retention-days: 1
      - name: Keep IRIS alive until Windows client finishes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            status=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "Windows PowerShell client") | .status')
            if [ "$status" = completed ]; then exit 0; fi
            sleep 10
          done
          echo 'Windows client did not finish before timeout.'
          exit 1
      - name: Remove temporary connection and runtime
        if: always()
        shell: bash
        run: |
          for process in tunnel proxy; do
            if [ -f "$RUNNER_TEMP/$process.pid" ]; then kill "$(cat "$RUNNER_TEMP/$process.pid")" || true; fi
          done
          docker compose down -v --remove-orphans
