name: Agentic edition static checks
on:
  push:
    branches: ['feature/agentic-interoperability-2026']
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate agentic source contracts (not IRIS runtime)
        run: node --test agentic/tests/contract.test.mjs
      - name: Validate agentic Compose syntax without downloading EAP images
        run: |
          export IRIS_PASSWORD="$(openssl rand -hex 24)"
          docker compose -f agentic/docker-compose.yml config --quiet
