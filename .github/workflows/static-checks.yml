name: Static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Validate browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check scripts/browser-acceptance.mjs

      - name: Validate browser shell integrity
        run: node scripts/static-ui-check.mjs

      - name: Validate ObjectScript runtime contracts
        run: node scripts/static-objectscript-check.mjs

      - name: Validate shell script syntax
        run: |
          bash -n scripts/smoke-test.sh
          bash -n scripts/release-validation.sh

      - name: Validate release fail-fast guards
        shell: bash
        run: |
          set -euo pipefail

          # These invalid configurations must be rejected before release
          # validation can pull images, remove volumes, or otherwise mutate the
          # Docker environment. A zero exit code would mean a safety regression.
          if IRIS_IMAGE=containers.intersystems.com/intersystems/iris-community:latest \
             IRIS_PASSWORD=ci-only-placeholder \
             ./scripts/release-validation.sh >/tmp/release-latest.out 2>&1; then
            cat /tmp/release-latest.out >&2
            echo 'release-validation.sh accepted an unpinned latest image.' >&2
            exit 1
          fi
          grep -q 'explicit non-latest tag' /tmp/release-latest.out

          if IRIS_IMAGE=containers.intersystems.com/intersystems/iris-community:2026.1-ci-placeholder \
             IRIS_PASSWORD=ci-only-placeholder \
             CONTAINER_HEALTH_TIMEOUT=0 \
             ./scripts/release-validation.sh >/tmp/release-timeout.out 2>&1; then
            cat /tmp/release-timeout.out >&2
            echo 'release-validation.sh accepted an invalid health timeout.' >&2
            exit 1
          fi
          grep -q 'positive integer' /tmp/release-timeout.out

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate required contest files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s SECURITY.md
          test -s Dockerfile
          test -s docker-compose.yml
          test -s docs/ARCHITECTURE.md
          test -s docs/DEMO.md
          test -s docs/TESTING.md
          test -s docs/CONTEST_SUBMISSION.md
          test -s docs/RELEASE_EVIDENCE.md
          test -s scripts/browser-acceptance.mjs
          test -s scripts/release-validation.sh
          test -s scripts/static-objectscript-check.mjs
          test -s src/IRISControlCenter/Installer.cls
          test -s src/IRISControlCenter/REST.cls
          test -s src/IRISControlCenter/ServiceDiscovery.cls

      - name: Guard against committed secrets
        shell: bash
        run: |
          set -euo pipefail
          pattern='authorization:[[:space:]]*(basic|bearer)[[:space:]]+[A-Za-z0-9+/_.=-]{8,}|password[[:space:]]*[:=][[:space:]]*[^$[:space:]][^[:space:]]{5,}'
          # Exclude documentation, smoke-test fixtures, and this workflow itself:
          # the fail-fast tests above intentionally contain an obvious dummy
          # password assignment, which must not make the secret scanner fail.
          if git grep -nEi "$pattern" -- ':!docs/*' ':!scripts/smoke-test.sh' ':!.github/workflows/static-checks.yml'; then
            echo 'Potential hard-coded credential found.' >&2
            exit 1
          fi
