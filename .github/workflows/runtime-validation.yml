name: IRIS runtime acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iris-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Keep CI on the same immutable Community image used by Compose. The
      # digest prevents a registry tag update from silently changing the runtime
      # under test.
      IRIS_IMAGE: intersystems/iris-community:2026.1@sha256:c57b65b2b454494091e7b3e49f6a53b3335f40adf475bcfcee0866083f35a7c2
      CONTAINER_HEALTH_TIMEOUT: 300

    steps:
      - name: Generate and mask disposable runtime credential
        shell: bash
        run: |
          runtime_credential="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$runtime_credential"
          printf 'IRIS_PASSWORD=%s\n' "$runtime_credential" >> "$GITHUB_ENV"

      - name: Clone public repository without credentials
        shell: bash
        env:
          VALIDATION_REPOSITORY: ${{ github.repository }}
          VALIDATION_SHA: ${{ github.sha }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git -c credential.helper= clone --no-checkout "https://github.com/$VALIDATION_REPOSITORY.git" .
          git -c credential.helper= fetch origin "$VALIDATION_SHA"
          git checkout --detach "$VALIDATION_SHA"
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"

      - name: Rehearse README installation from public checkout
        shell: bash
        run: |
          set -o pipefail
          {
            printf 'Public checkout commit: %s\n' "$(git rev-parse HEAD)"
            docker compose up --build -d
            ./scripts/smoke-test.sh
            echo 'Fresh public-checkout README installation passed.'
          } 2>&1 | tee public-install-validation.log

      - name: Run clean release validation
        # Keep the complete non-secret transcript as release evidence. The
        # validation scripts never print IRIS_PASSWORD; pipefail preserves the
        # validator's exit status if tee succeeds after a failure.
        run: |
          set -o pipefail
          ./scripts/release-validation.sh 2>&1 | tee release-validation.log

      - name: Upload release validation transcript
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-validation-${{ github.run_id }}
          path: |
            release-validation.log
            public-install-validation.log
          if-no-files-found: warn
          retention-days: 14

      - name: Install browser acceptance dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real-browser acceptance
        env:
          BROWSER_ARTIFACT_DIR: browser-evidence
        run: node scripts/browser-acceptance.mjs

      - name: Upload real-browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ github.run_id }}
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Capture container diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color iris || true

      - name: Tear down disposable runtime
        if: always()
        run: docker compose down -v --remove-orphans || true
