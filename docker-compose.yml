services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: ${IRIS_IMAGE:-containers.intersystems.com/intersystems/iris-community:latest-em}
    init: true
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - iris-data:/home/irisowner/irisdata
    environment:
      - ISC_DATA_DIRECTORY=/home/irisowner/irisdata
    command: --check-caps false
    healthcheck:
      test: ["CMD-SHELL", "iris status IRIS >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  iris-data:
