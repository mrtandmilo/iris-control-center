services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: ${IRIS_IMAGE:-intersystems/iris-community:2026.1@sha256:c57b65b2b454494091e7b3e49f6a53b3335f40adf475bcfcee0866083f35a7c2}
    init: true
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - iris-data:/home/irisowner/irisdata
    environment:
      - ISC_DATA_DIRECTORY=/home/irisowner/irisdata
      # The Community image consumes IRIS_PASSWORD while initializing a fresh
      # durable instance. Keeping the Compose value aligned with smoke/release
      # validation ensures the credentials used by tests are the credentials
      # configured in the container rather than an unrelated image default.
      - IRIS_PASSWORD=${IRIS_PASSWORD:-SYS}
    command: --check-caps false
    healthcheck:
      # `iris status` exits non-zero when IRIS is running with a warning (for
      # example the Community image's normal startup alert). qlist reports the
      # actual instance state without treating that warning as a failed runtime.
      # Use YAML single quotes so the regex backslash is passed through literally.
      test: ['CMD-SHELL', 'iris qlist IRIS 2>/dev/null | grep -q ''\^running,''']
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  iris-data:
