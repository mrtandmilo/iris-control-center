services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        IMAGE: ${IRIS_IMAGE:-containers.intersystems.com/intersystems/iris-community:latest-em}
    init: true
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - iris-data:/home/irisowner/irisdata
    environment:
      - ISC_DATA_DIRECTORY=/home/irisowner/irisdata
    command: --check-caps false

volumes:
  iris-data:
