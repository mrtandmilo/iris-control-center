services:
  iris:
    image: containers.intersystems.com/intersystems/iris-community:latest-em
    init: true
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - ./:/home/irisowner/dev
    environment:
      - ISC_DATA_DIRECTORY=/home/irisowner/irisdata
    command: --check-caps false
